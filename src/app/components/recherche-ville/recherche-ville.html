<section class="search-panel">
  <form
    class="search-form"
    (ngSubmit)="lancerRecherche()"
  >
    <label class="sr-only" for="ville">
      Rechercher une ville
    </label>

    <div class="input-wrapper">
      <span aria-hidden="true">⌖</span>

      <input
        id="ville"
        type="search"
        name="ville"
        [ngModel]="villeRecherchee()"
        (ngModelChange)="villeRecherchee.set($event)"
        placeholder="Rechercher une ville..."
        autocomplete="off"
      >
    </div>

    <button
      class="search-button"
      type="submit"
      [disabled]="chargement()"
    >
      <span aria-hidden="true">⌕</span>

      {{ chargement() ? 'Recherche...' : 'Rechercher' }}
    </button>
  </form>
  <button
    class="location-button"
    type="button"
    [disabled]="chargement() || chargementPosition()"
    (click)="demanderPosition()"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        d="M20 10c0 5-8 12-8 12S4 15 4 10
          a8 8 0 1 1 16 0Z"
      />
      <circle cx="12" cy="10" r="3" />
    </svg>

    {{
      chargementPosition()
        ? 'Localisation...'
        : 'Utiliser ma position'
    }}
  </button>

  @if (erreur()) {
    <p class="error-message" aria-live="polite">
      {{ erreur() }}
    </p>
  }

  @if (resultats().length > 0) {
    <div class="search-results">
      @for (ville of resultats(); track ville.id) {
        <button
          class="city-result"
          type="button"
          [disabled]="chargement() || chargementPosition()"
          (click)="choisirVille(ville)"
        >
          <span class="city-name">
            {{ ville.name }}
          </span>

          <span class="city-region">
            @if (ville.admin1) {
              {{ ville.admin1 }}
            }

            @if (ville.country) {
              — {{ ville.country }}
            }
          </span>
        </button>
      }
    </div>
  }
</section>
