<div class="weather-page">
  <main class="weather-shell">

    <header class="app-header">
      <div>
        <p class="eyebrow">
          <span class="live-dot"></span>
          Météo en direct
        </p>

        <h1>Application météo</h1>
        <p class="intro">
          Consultez les conditions météorologiques de votre ville.
        </p>
      </div>

      <div class="live-status">
        <span class="live-dot"></span>
        Données en direct
      </div>
    </header>

      <app-recherche-ville
        [(villeRecherchee)]="villeRecherchee"
        [resultats]="resultats()"
        [chargement]="chargement()"
        [erreur]="erreur()"
        (rechercheDemandee)="rechercher()"
        (villeChoisie)="choisirVille($event)"
      />

    @if (chargementMeteo()) {
      <div class="loading-message" aria-live="polite">
        <span class="loader"></span>
        Chargement de la météo...
      </div>
    }

    @if (meteo(); as resultatMeteo) {

      <section class="weather-card">

        <app-meteo-actuelle
          [ville]="villeSelectionnee()!"
          [meteo]="resultatMeteo.current"
          [condition]="conditionMeteo(
            resultatMeteo.current.weather_code
          )"
        />
        <app-previsions-horaires
            [previsions]="previsionsHoraires()"
        />

        <app-previsions-journalieres
          [previsions]="previsionsJournalieres()"
        />

          <footer class="weather-footer">
            Dernière mise à jour à
            {{ resultatMeteo.current.time.slice(11, 16) }}
          </footer>
      </section>
    }

  </main>
</div>
